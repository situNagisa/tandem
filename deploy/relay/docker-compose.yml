services:
  relay:
    build:
      context: ../..
      dockerfile: packages/relay/Dockerfile
    image: tandem-relay:local
    restart: unless-stopped
    expose:
      - "7950"
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7950/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      TANDEM_RELAY_DOMAIN: ${TANDEM_RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
